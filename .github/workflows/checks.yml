name: Research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Check published source and result exports
        run: python scripts/validate_project.py --skip-data
      - name: Check trading and temporal contracts
        run: python -m unittest discover -s tests -v
